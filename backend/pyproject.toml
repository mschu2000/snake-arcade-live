[project]
name = "snake-arena-backend"
version = "0.1.0"
description = "Backend for Snake Arena"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.18.4",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_integration"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.4.0",
]
